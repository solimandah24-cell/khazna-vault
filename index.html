<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>خزنة — الخزنة الرقمية الذكية</title>
<meta name="theme-color" content="#1C9C82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خزنة">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#EEF0F7; --border:#E1E4EF;
  --text:#1B2340; --text-dim:#5B6180; --text-faint:#9198B5;
  --accent:#1C9C82; --accent-strong:#127A65; --accent-soft:#E3F5F0;
  --navy:#1B2340; --navy-soft:#2A3358;
  --danger:#E1495B; --danger-soft:#FBE7E9;
  --warn:#C98A1D; --warn-soft:#FBF0DC;
  --safe:#1C9C82; --safe-soft:#E3F5F0;
  --shadow: 0 1px 2px rgba(27,35,64,.04), 0 8px 24px -12px rgba(27,35,64,.18);
  --radius: 18px;
  --font: 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
[data-theme="dark"]{
  --bg:#12162A; --surface:#191E38; --surface-2:#212748; --border:#2B3157;
  --text:#EEF0FA; --text-dim:#AEB3D6; --text-faint:#767CA3;
  --accent:#2FD7B0; --accent-strong:#4FE3C4; --accent-soft:#173A34;
  --navy:#0D1024; --navy-soft:#1B2144;
  --danger:#FF7A8A; --danger-soft:#3A1D26;
  --warn:#F0C05A; --warn-soft:#372B12;
  --safe:#2FD7B0; --safe-soft:#123B33;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  transition:background .25s ease,color .25s ease;
  min-height:100vh; overflow-x:hidden;
}
#root{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:86px;}
button{font-family:var(--font); cursor:pointer;}
input,select,textarea{font-family:var(--font);}
::selection{background:var(--accent-soft); color:var(--accent-strong);}

/* ---------- shared bits ---------- */
.screen{padding:20px 18px 12px; animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
.h1{font-size:22px; font-weight:700; margin:0 0 4px;}
.h2{font-size:18px; font-weight:700; margin:0 0 2px;}
.sub{color:var(--text-dim); font-size:13.5px; line-height:1.6; margin:0;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.btn{border:none; border-radius:14px; padding:14px 18px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease, opacity .12s ease, background .2s ease; width:100%;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:#06231C;}
[data-theme="dark"] .btn-primary{color:#04140F;}
.btn-primary:disabled{opacity:.45; pointer-events:none;}
.btn-ghost{background:var(--surface-2); color:var(--text);}
.btn-outline{background:transparent; color:var(--accent); border:1.5px solid var(--accent);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-sm{padding:9px 12px; font-size:13px; width:auto; border-radius:10px;}
.link-btn{background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; padding:8px 2px 0; cursor:pointer; text-align:right; width:100%;}
.field-hint{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;}
.field input.ok{border-color:var(--safe) !important;}
.field input.bad{border-color:var(--danger) !important;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--surface-2); border:1.5px solid transparent; border-radius:12px;
  padding:12px 14px; font-size:14.5px; color:var(--text); outline:none; transition:border-color .15s ease;
}
.field textarea{resize:vertical; min-height:70px; font-family:var(--font);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field .pwd-wrap{position:relative;}
.field .pwd-wrap input{padding-left:40px;}
.field .pwd-wrap .eye{position:absolute; left:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:16px; color:var(--text-dim); padding:6px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:7px 13px; border-radius:20px; background:var(--surface-2); font-size:12.5px; font-weight:600; color:var(--text-dim); border:1.5px solid transparent; cursor:pointer; user-select:none;}
.chip.active{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 2px;}
.toggle-row .lbl{font-size:14px; font-weight:500;}
.switch{width:44px; height:26px; border-radius:20px; background:var(--surface-2); position:relative; border:none; flex-shrink:0;}
.switch::after{content:''; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s ease;}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(-18px);}
.masked{font-family:var(--mono); letter-spacing:1px; direction:ltr; display:inline-block;}
.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--navy); color:#fff; padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600;
  z-index:999; pointer-events:none; transition:all .25s ease; box-shadow:var(--shadow); white-space:nowrap; max-width:88%;
  display:flex; align-items:center; gap:8px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.back-btn{width:36px; height:36px; border-radius:11px; background:var(--surface-2); border:none; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text); flex-shrink:0;}
.icon-btn{width:38px; height:38px; border-radius:12px; background:var(--surface-2); border:none; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:60;
}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:6px 2px; color:var(--text-faint); font-size:10.5px; font-weight:600; border-radius:12px;}
.nav-item .ic{font-size:19px; line-height:1;}
.nav-item.active{color:var(--accent);}
.nav-item.fab{margin-top:-22px;}
.nav-item.fab .ic{width:46px; height:46px; border-radius:50%; background:var(--accent); color:#06231C; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 8px 18px -6px rgba(28,156,130,.55);}
[data-theme="dark"] .nav-item.fab .ic{color:#04140F;}

/* ---------- onboarding / lock ---------- */
.onb{min-height:100vh; display:flex; flex-direction:column; padding:32px 24px; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-soft) 100%); color:#fff;}
.onb .spacer{flex:1;}
.vault-mark{width:76px; height:76px; border-radius:22px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:34px; margin-bottom:22px; border:1px solid rgba(255,255,255,.14);}
.onb h1{font-size:26px; font-weight:700; margin:0 0 10px; line-height:1.35;}
.onb p{color:rgba(255,255,255,.65); font-size:14.5px; line-height:1.7; margin:0 0 26px;}
.onb .dots{display:flex; gap:6px; margin-bottom:18px;}
.onb .dots span{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.25);}
.onb .dots span.on{background:var(--accent); width:20px; border-radius:4px;}
.onb .feature{display:flex; align-items:center; gap:12px; padding:10px 0; color:rgba(255,255,255,.85); font-size:13.5px;}
.onb .feature .em{font-size:18px;}
.onb-input{width:100%; background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16); border-radius:14px; padding:14px 16px; font-size:15px; color:#fff; outline:none; margin-bottom:12px;}
.onb-input::placeholder{color:rgba(255,255,255,.4);}
.onb-input:focus{border-color:var(--accent);}
.strength-bar{height:5px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; margin-bottom:6px;}
.strength-bar i{display:block; height:100%; border-radius:4px; transition:width .25s ease, background .25s ease;}
.strength-label{font-size:11.5px; color:rgba(255,255,255,.55); margin-bottom:18px;}
.lock-avatar{width:88px; height:88px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong); display:flex; align-items:center; justify-content:center; font-size:38px; margin:0 auto 18px;}
.dot-pins{display:flex; justify-content:center; gap:12px; margin:22px 0;}
.dot-pins span{width:13px; height:13px; border-radius:50%; border:1.5px solid var(--text-faint); transition:all .15s ease;}
.dot-pins span.filled{background:var(--accent); border-color:var(--accent);}
.dot-pins span.err{background:var(--danger); border-color:var(--danger);}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
.keypad button{aspect-ratio:1; border-radius:50%; background:var(--surface-2); border:none; font-size:20px; font-weight:600; color:var(--text);}
.keypad button:active{background:var(--accent-soft);}
.keypad button.ghost{background:none; color:var(--text-dim); font-size:14px;}

/* ---------- dashboard ---------- */
.search-bar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:12px 14px; margin:14px 0 18px;}
.search-bar input{border:none; background:none; outline:none; flex:1; font-size:14.5px; color:var(--text);}
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:22px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center;}
.stat-card .n{font-size:18px; font-weight:700;}
.stat-card .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px;}
.section-title h3{font-size:15.5px; font-weight:700; margin:0;}
.section-title .more{font-size:12.5px; color:var(--accent); font-weight:600; background:none; border:none;}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
.cat-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px; text-align:right; border:none;}
.cat-card .em{font-size:22px;}
.cat-card .t{font-size:13.5px; font-weight:700;}
.cat-card .c{font-size:11.5px; color:var(--text-dim);}
.fav-scroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin:0 -18px; padding-inline:18px;}
.fav-scroll::-webkit-scrollbar{display:none;}
.fav-chip{flex-shrink:0; width:118px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:right;}
.fav-chip .em{font-size:18px; margin-bottom:6px;}
.fav-chip .t{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fav-chip .s{font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.empty-hint{text-align:center; padding:34px 12px; color:var(--text-faint); font-size:13px;}
.empty-hint .em{font-size:30px; margin-bottom:8px; display:block;}

/* ---------- item list / cards ---------- */
.item-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px 14px; margin-bottom:10px;}
.item-row .avatar{width:42px; height:42px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.item-row .info{flex:1; min-width:0;}
.item-row .t{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-row .s{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-row .star{background:none; border:none; font-size:17px; color:var(--text-faint); flex-shrink:0; padding:6px;}
.item-row .star.on{color:#E8B93B;}

/* ---------- detail sheet ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,12,26,.5); z-index:100; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .22s ease;}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{width:100%; max-width:480px; margin:0 auto; background:var(--bg); border-radius:24px 24px 0 0; max-height:92vh; overflow-y:auto; transform:translateY(16px); transition:transform .25s ease; padding-bottom:30px;}
.overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:38px; height:4px; background:var(--border); border-radius:3px; margin:10px auto 4px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 4px;}
.detail-hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 18px 18px;}
.detail-hero .avatar{width:60px; height:60px; border-radius:18px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:10px;}
.detail-hero .t{font-size:17px; font-weight:700;}
.detail-hero .s{font-size:12.5px; color:var(--text-dim);}
.detail-field{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--border);}
.detail-field:last-child{border-bottom:none;}
.detail-field .l{font-size:11.5px; color:var(--text-dim); margin-bottom:3px;}
.detail-field .v{font-size:14px; font-weight:600;}
.detail-field .acts{display:flex; gap:4px; flex-shrink:0;}
.tiny-btn{background:var(--surface-2); border:none; border-radius:9px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--text-dim); flex-shrink:0;}
.detail-actions{display:flex; gap:10px; padding:16px 16px 4px;}
.sheet-body-card{margin:0 16px; overflow:hidden;}
.sheet-title{font-size:16.5px; font-weight:700; padding:6px 18px 14px;}

/* ---------- generator ---------- */
.gen-display{background:var(--navy); color:#fff; border-radius:18px; padding:22px 16px; text-align:center; margin-bottom:20px;}
.gen-display .pw{font-family:var(--mono); font-size:19px; letter-spacing:1px; direction:ltr; word-break:break-all; margin-bottom:14px;}
.gen-display .row-actions{display:flex; gap:10px;}
.gen-display .row-actions button{flex:1; background:rgba(255,255,255,.1); color:#fff; border:none; border-radius:12px; padding:10px; font-size:13px; font-weight:600;}
.slider-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.slider-row .val{font-family:var(--mono); font-weight:700; color:var(--accent);}
input[type=range]{width:100%; accent-color:var(--accent); margin-bottom:18px;}

/* ---------- security center ---------- */
.score-ring-wrap{display:flex; flex-direction:column; align-items:center; padding:14px 0 22px;}
.score-ring{position:relative; width:150px; height:150px;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.score-ring .num b{font-size:30px; font-weight:700;}
.score-ring .num span{font-size:11px; color:var(--text-dim);}
.sec-item{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--border);}
.sec-item:last-child{border-bottom:none;}
.sec-item .ic{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.sec-item .txt .t{font-size:13.5px; font-weight:600;}
.sec-item .txt .s{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

/* ---------- settings ---------- */
.set-group{margin-bottom:20px;}
.set-group .g-title{font-size:12px; font-weight:700; color:var(--text-faint); margin:0 0 8px 4px;}
.set-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--border);}
.set-row:last-child{border-bottom:none;}
.set-row .ic{width:32px; height:32px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.set-row .t{font-size:13.5px; font-weight:600; flex:1;}
.set-row .v{font-size:12.5px; color:var(--text-dim);}
.chev{color:var(--text-faint); font-size:13px;}

/* ---------- add sheet segmented ---------- */
.type-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:4px 16px 6px;}
.type-card{background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:16px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; border:none;}
.type-card .em{font-size:26px;}
.type-card .t{font-size:12.5px; font-weight:700;}

.note{background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:11px 13px; font-size:11.5px; line-height:1.7; margin:14px 16px 4px;}
.brand-badge{display:flex; align-items:center; gap:10px; padding:0 2px 18px;}
.brand-badge .em{font-size:22px;}
.brand-badge .t{font-size:16px; font-weight:700;}
</style>
</head>
<body data-theme="light">
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================= DEMO DATA & STATE =============================
   بيانات تجريبية فقط لأغراض العرض — لا تُستخدم بيانات حقيقية.
   ملاحظة معمارية: في نسخة الإنتاج يجب تخزين البيانات الحساسة بعد تشفيرها
   محليًا (مثل Android Keystore / SQLCipher) ولا يجب أن تُقرأ كنص عادي أبدًا،
   لا من قبل المطور ولا من الخادم. هذا النموذج يحتفظ بالحالة في الذاكرة فقط
   خلال الجلسة الحالية (لا localStorage) توافقًا مع بيئة العرض. */

let uid = 100;
const newId = () => 'it_' + (uid++);

const state = {
  theme: 'light',
  route: 'dashboard', // onboard-welcome, onboard-create, onboard-confirm, onboard-bio, lock, dashboard, category, generator, security, settings
  locked: false,
  masterSet: false, // هل قام المستخدم بإنشاء كلمة مرور اختيارية لحماية التطبيق؟
  masterPassword: null, // في الذاكرة فقط أثناء الجلسة المفتوحة، لا يُحفظ أبدًا في localStorage
  cryptoKey: null, // مفتاح AES-256 المشتق من كلمة المرور، في الذاكرة فقط
  encSalt: null, // الملح المستخدم لاشتقاق المفتاح (غير سرّي، يُحفظ لإعادة الاشتقاق لاحقًا)
  bioEnabled: false,
  pinBuffer: '',
  pinError: false,
  categoryType: null,
  search: '',
  modal: null, // {type:'detail'|'add'|'addPickType', itemType, item}
  revealed: new Set(),
  toastTimer: null,
  clipTimer: null,
  editDraft: null,
  autoLockMinutes: 1, // -1 = تعطيل، 0 = فورًا عند الخروج، رقم = دقائق الخمول
  lastActivity: Date.now(),
  hiddenAt: null,
  items: {
    account: [],
    bank: [],
    card: [],
    gov: [],
    note: [],
  },
};

const TYPE_META = {
  account: {label:'الحسابات وكلمات المرور', short:'حساب', em:'🔐', color:'accent'},
  bank:    {label:'البنوك', short:'بنك', em:'🏦', color:'accent'},
  card:    {label:'البطاقات', short:'بطاقة', em:'💳', color:'accent'},
  gov:     {label:'الحسابات الحكومية', short:'حساب حكومي', em:'🏛️', color:'accent'},
  note:    {label:'الملاحظات السرية', short:'ملاحظة', em:'📝', color:'accent'},
};

const CATEGORIES = ['شخصي','العمل','البنوك','الحكومة','التسوق'];

/* ============================= HELPERS ============================= */
function $(sel, el=document){ return el.querySelector(sel); }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg, icon){
  const t = $('#toast');
  t.innerHTML = (icon?`<span>${icon}</span>`:'') + `<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function copyText(text, label, sensitive){
  const doCopy = () => {
    try{
      navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(err){}
      document.body.removeChild(ta);
    }
  };
  doCopy();
  showToast(sensitive ? `تم نسخ ${label} — سيُمسح خلال 20 ثانية` : `تم نسخ ${label}`, '✅');
  if(sensitive){
    clearTimeout(state.clipTimer);
    state.clipTimer = setTimeout(()=>{
      try{ navigator.clipboard.writeText(''); }catch(e){}
    }, 20000);
  }
}

function maskMiddle(v){
  if(!v) return '';
  const s = v.toString();
  if(s.length<=4) return '•'.repeat(s.length);
  return '•'.repeat(Math.max(0,s.length-4)) + s.slice(-4);
}
function maskCard(v){
  const s=(v||'').replace(/\s/g,'');
  const last4 = s.slice(-4);
  return `•••• •••• •••• ${last4}`;
}
function maskFull(v){ return '•'.repeat(Math.min(12,(v||'').length||8)); }

/* ---------- استخراج بيانات الآيبان السعودي ---------- */
// يتحقق من صحة الآيبان عبر خوارزمية mod-97 المعيارية (ISO 13616) ويستخرج رمز البنك ورقم الحساب
function parseSaudiIban(raw){
  const iban = (raw||'').replace(/\s/g,'').toUpperCase();
  if(!/^SA\d{22}$/.test(iban)) return null;
  const rearranged = iban.slice(4) + iban.slice(0,4);
  const numeric = rearranged.replace(/[A-Z]/g, ch => (ch.charCodeAt(0)-55).toString());
  let remainder = numeric;
  while(remainder.length>9){
    const chunk = remainder.slice(0,9);
    remainder = (parseInt(chunk,10) % 97).toString() + remainder.slice(chunk.length);
  }
  const valid = (parseInt(remainder,10) % 97) === 1;
  return { valid, bankCode: iban.slice(4,6), account: iban.slice(6) };
}

/* ---------- استخراج بيانات البطاقة ---------- */
// كشف شبكة البطاقة عبر بادئات BIN المعيارية والمعروفة عالميًا
function detectCardBrand(digits){
  if(/^4\d*/.test(digits) && digits.length>=1) return 'Visa';
  if(/^(5[1-5]|2[2-7])/.test(digits)) return 'Mastercard';
  if(/^3[47]/.test(digits)) return 'American Express';
  if(/^(6011|65)/.test(digits)) return 'Discover';
  if(/^35/.test(digits)) return 'JCB';
  return null;
}
// خوارزمية Luhn المعيارية للتحقق من صحة رقم البطاقة رياضيًا
function luhnValid(digits){
  if(digits.length<12) return null;
  let sum=0, alt=false;
  for(let i=digits.length-1;i>=0;i--){
    let n=parseInt(digits[i],10);
    if(alt){ n*=2; if(n>9) n-=9; }
    sum+=n; alt=!alt;
  }
  return sum%10===0;
}
function formatCardDigits(digits){ return digits.replace(/(\d{4})(?=\d)/g,'$1 '); }

/* ---------- مسح البطاقة بالكاميرا (OCR داخل الجهاز بالكامل) ---------- */
// يتم تحميل مكتبة Tesseract.js (مفتوحة المصدر لقراءة النصوص من الصور) عند أول استخدام فقط
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('تعذّر تحميل مكتبة القراءة، تحقق من اتصال الإنترنت'));
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}
// استخراج رقم البطاقة وتاريخ الانتهاء من النص المستخرج من الصورة (بحث بأنماط قياسية للبطاقات)
function parseCardOcrText(text){
  const result = {};
  const digitGroups = text.match(/(?:\d[\s\-]?){12,19}\d/g) || [];
  let best = null;
  digitGroups.forEach(g=>{
    const clean = g.replace(/[^\d]/g,'');
    if(clean.length>=13 && clean.length<=19){
      if(!best) best = clean;
      else if(luhnValid(clean) && !luhnValid(best)) best = clean;
    }
  });
  if(best) result.number = best;
  const expMatch = text.match(/(0[1-9]|1[0-2])\s*[\/\-]\s*(\d{2}|\d{4})/);
  if(expMatch){
    let mm = expMatch[1];
    let yy = expMatch[2];
    if(yy.length===4) yy = yy.slice(2);
    result.expiry = `${mm}/${yy}`;
  }
  return result;
}
async function scanCardImage(file, statusEl){
  statusEl.textContent = '🔎 جارٍ تحميل أداة القراءة…';
  try{
    await loadTesseract();
    statusEl.textContent = '📷 جارٍ تحليل الصورة…';
    const { data: { text } } = await window.Tesseract.recognize(file, 'eng');
    const info = parseCardOcrText(text);
    if(!info.number && !info.expiry){
      statusEl.textContent = '⚠️ لم أستطع قراءة البيانات بوضوح، أدخلها يدويًا';
      return null;
    }
    statusEl.textContent = '✅ تم الاستخراج — تحقق من البيانات قبل الحفظ';
    return info;
  }catch(e){
    statusEl.textContent = '⚠️ تعذّرت قراءة الصورة، أدخل البيانات يدويًا';
    return null;
  }
}

function passwordStrength(pw){
  if(!pw) return {score:0, label:'—', color:'var(--text-faint)'};
  let score=0;
  if(pw.length>=8) score++;
  if(pw.length>=12) score++;
  if(/[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  const levels=[
    {label:'ضعيفة جدًا', color:'var(--danger)'},
    {label:'ضعيفة', color:'var(--danger)'},
    {label:'متوسطة', color:'var(--warn)'},
    {label:'جيدة', color:'var(--warn)'},
    {label:'قوية', color:'var(--safe)'},
    {label:'قوية جدًا', color:'var(--safe)'},
  ];
  return {score, ...levels[Math.min(score,5)]};
}

function allItemsFlat(){
  const out=[];
  Object.keys(state.items).forEach(type=>{
    state.items[type].forEach(it=>out.push({...it, __type:type}));
  });
  return out;
}

function itemTitle(it, type){
  if(type==='account') return it.service;
  if(type==='bank') return it.bankName;
  if(type==='card') return it.cardName;
  if(type==='gov') return it.entity;
  if(type==='note') return it.title;
}
function itemSubtitle(it, type){
  if(type==='account') return it.username || it.email;
  if(type==='bank') return maskMiddle(it.iban);
  if(type==='card') return maskCard(it.number);
  if(type==='gov') return it.username;
  if(type==='note') return (it.content||'').slice(0,34);
}

function searchItems(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const kw = {
    'بنك':'bank','بنوك':'bank','بطاقة':'card','بطاقات':'card','حكوم':'gov',
    'ملاحظ':'note','حساب':'account','iban':'field:iban','ايبان':'field:iban'
  };
  let typeFilter=null, fieldFilter=null;
  for(const k in kw){
    if(q.includes(k)){
      if(kw[k].startsWith('field:')) fieldFilter=kw[k].split(':')[1];
      else typeFilter=kw[k];
    }
  }
  return allItemsFlat().filter(it=>{
    if(typeFilter && it.__type!==typeFilter && !fieldFilter) return true && matchText(it,q);
    if(fieldFilter) return (it[fieldFilter]||'').toLowerCase().includes(q.replace(/[^a-z0-9]/g,'')) || matchText(it,q);
    return matchText(it,q);
  });
}
function matchText(it,q){
  const hay = Object.values(it).filter(v=>typeof v==='string').join(' ').toLowerCase();
  return hay.includes(q);
}

/* ============================= LOCAL PERSISTENCE + ENCRYPTION =============================
   بدون كلمة مرور: تُحفظ البيانات محليًا كنص عادي (كما كان سابقًا) — ملائم للاستخدام السريع.
   بعد إنشاء كلمة مرور للتطبيق: يتم تشفير البيانات فعليًا بمعيار AES-256-GCM عبر Web Crypto API،
   والمفتاح يُشتق من كلمة المرور نفسها عبر PBKDF2 (150000 تكرار) — كلمة المرور لا تُخزَّن أبدًا،
   لا في الذاكرة الدائمة ولا في localStorage. فك التشفير الناجح هو نفسه التحقق من كلمة المرور. */
const STORAGE_KEY = 'khazna_vault_data_v1';       // بيانات عامة غير حساسة + بيانات عادية إذا لا توجد كلمة مرور
const ENC_STORAGE_KEY = 'khazna_vault_secure_v1'; // البيانات المشفّرة (تُستخدم فقط عند وجود كلمة مرور)

const textEnc = new TextEncoder();
const textDec = new TextDecoder();
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}
function hasWebCrypto(){ return !!(window.crypto && window.crypto.subtle); }

// يشتق مفتاح AES-256 من كلمة المرور. مرّر saltB64 موجودًا لإعادة اشتقاق نفس المفتاح، أو اتركه فارغًا لإنشاء ملح جديد.
async function deriveKey(password, saltB64){
  const salt = saltB64 ? new Uint8Array(b64ToBuf(saltB64)) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey('raw', textEnc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
  return {key, saltB64: bufToB64(salt.buffer)};
}
async function encryptJson(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, textEnc.encode(JSON.stringify(obj)));
  return { iv: bufToB64(iv.buffer), data: bufToB64(cipherBuf) };
}
async function decryptJson(key, payload){
  const iv = new Uint8Array(b64ToBuf(payload.iv));
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, b64ToBuf(payload.data));
  return JSON.parse(textDec.decode(plainBuf));
}
function emptyItemsTemplate(){ return {account:[], bank:[], card:[], gov:[], note:[]}; }
function recomputeUidFromItems(){
  let maxId = 99;
  Object.values(state.items||{}).forEach(list=>{
    (list||[]).forEach(it=>{
      const n = parseInt(String(it.id||'').replace('it_',''), 10);
      if(!isNaN(n) && n>maxId) maxId = n;
    });
  });
  uid = maxId + 1;
}

function saveMetaToStorage(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      theme: state.theme,
      masterSet: state.masterSet,
      salt: state.masterSet ? state.encSalt : null,
      bioEnabled: state.bioEnabled,
      autoLockMinutes: state.autoLockMinutes,
      // العناصر تُحفظ هنا كنص عادي فقط إذا لم تُفعَّل كلمة مرور التطبيق
      items: state.masterSet ? undefined : state.items,
    }));
  }catch(e){ /* تجاهل أخطاء التخزين (مثل وضع التصفح الخاص) */ }
}
async function saveEncryptedItems(){
  if(!state.masterSet || !state.cryptoKey) return;
  try{
    const payload = await encryptJson(state.cryptoKey, state.items);
    localStorage.setItem(ENC_STORAGE_KEY, JSON.stringify(payload));
  }catch(e){ console.error('encryption save failed', e); }
}
function saveToStorage(){
  saveMetaToStorage();
  if(state.masterSet && state.cryptoKey) saveEncryptedItems(); // غير متزامن، لا يوقف الواجهة
}

function loadFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data && data.theme) state.theme = data.theme;
    if(data && data.masterSet && data.salt){
      state.masterSet = true;
      state.encSalt = data.salt;
      state.bioEnabled = !!data.bioEnabled;
      state.autoLockMinutes = (typeof data.autoLockMinutes==='number') ? data.autoLockMinutes : 1;
      // البيانات مشفّرة على القرص؛ لا يمكن قراءتها إلا بعد إدخال كلمة المرور الصحيحة في شاشة القفل
      state.items = emptyItemsTemplate();
      state.locked = true;
      state.route = 'lock';
    } else if(data && data.items){
      state.items = data.items;
      recomputeUidFromItems();
    }
  }catch(e){ /* بيانات محفوظة تالفة أو غير موجودة */ }
}
loadFromStorage();

// قفل الخزنة: يمسح البيانات المفكوكة والمفتاح من الذاكرة، ولا يبقي شيئًا حساسًا إلا بعد إعادة إدخال كلمة المرور
function lockVault(){
  if(!state.masterSet) return;
  state.items = emptyItemsTemplate();
  state.cryptoKey = null;
  state.masterPassword = null;
  state.locked = true; state.pinBuffer=''; state.pinError=false; state.modal=null; state.route='lock';
}

/* ============================= RENDER ROOT ============================= */
function render(){
  saveToStorage();
  document.body.setAttribute('data-theme', state.theme);
  const root = $('#root');
  root.innerHTML = '';

  if(['onboard-welcome','onboard-create','onboard-confirm','onboard-bio'].includes(state.route)){
    root.appendChild(renderOnboarding());
    return;
  }
  if(state.route==='lock'){
    root.appendChild(renderLock());
    return;
  }

  const screen = el('div','screen');
  if(state.route==='dashboard') screen.appendChild(renderDashboard());
  else if(state.route==='category') screen.appendChild(renderCategory());
  else if(state.route==='generator') screen.appendChild(renderGenerator());
  else if(state.route==='security') screen.appendChild(renderSecurity());
  else if(state.route==='settings') screen.appendChild(renderSettings());
  root.appendChild(screen);
  root.appendChild(renderBottomNav());

  if(state.modal) root.appendChild(renderModal());
}

/* ============================= LOCK SCREEN ============================= */
function renderLock(){
  const wrap = el('div','onb');
  wrap.style.justifyContent='center';
  wrap.innerHTML = `
    <div class="spacer"></div>
    <div style="text-align:center;">
      <div class="vault-mark" style="margin:0 auto 18px;">🔐</div>
      <h1 style="text-align:center;">الخزنة مقفلة</h1>
      <p style="text-align:center;" id="lockSub">أدخل كلمة المرور لفك تشفير بياناتك</p>
    </div>
    <div class="dot-pins" id="pins"></div>
    <div class="keypad" id="keypad"></div>
    <div class="spacer"></div>
  `;
  const pinsWrap = wrap.querySelector('#pins');
  const keypad = wrap.querySelector('#keypad');
  const sub = wrap.querySelector('#lockSub');
  let busy = false;

  function drawPins(){
    pinsWrap.innerHTML='';
    const len = Math.max(6, state.pinBuffer.length);
    for(let i=0;i<Math.min(len,10);i++){
      const s = el('span');
      if(state.pinError) s.classList.add('err');
      else if(i<state.pinBuffer.length) s.classList.add('filled');
      pinsWrap.appendChild(s);
    }
  }
  drawPins();

  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  keys.forEach(k=>{
    const b = el('button', k==='⌫'||k==='✓'?'ghost':'', k);
    b.onclick = ()=>{
      if(busy) return;
      if(k==='⌫'){ state.pinBuffer = state.pinBuffer.slice(0,-1); state.pinError=false; }
      else if(k==='✓'){ tryUnlock(); return; }
      else { state.pinBuffer += k; state.pinError=false; }
      drawPins();
    };
    keypad.appendChild(b);
  });

  async function tryUnlock(){
    if(busy || !state.pinBuffer) return;
    if(!hasWebCrypto()){
      sub.textContent = '⚠️ التشفير يحتاج فتح الملف عبر HTTPS (مثل GitHub Pages) وليس مباشرة من الجهاز';
      return;
    }
    busy = true; sub.textContent = 'جارٍ فك التشفير…';
    try{
      const {key} = await deriveKey(state.pinBuffer, state.encSalt);
      const encRaw = localStorage.getItem(ENC_STORAGE_KEY);
      const items = encRaw ? await decryptJson(key, JSON.parse(encRaw)) : emptyItemsTemplate();
      state.items = items;
      state.cryptoKey = key;
      state.masterPassword = state.pinBuffer;
      recomputeUidFromItems();
      state.locked=false; state.pinBuffer=''; state.route='dashboard'; state.lastActivity=Date.now(); render();
    }catch(e){
      busy = false; sub.textContent = 'أدخل كلمة المرور لفك تشفير بياناتك';
      state.pinError=true; drawPins();
      setTimeout(()=>{ state.pinBuffer=''; state.pinError=false; drawPins(); }, 500);
    }
  }

  // allow typing with keyboard too, since master password may include letters/symbols
  wrap.tabIndex=0;
  setTimeout(()=>wrap.focus(),50);
  wrap.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ tryUnlock(); return; }
    if(e.key==='Backspace'){ state.pinBuffer=state.pinBuffer.slice(0,-1); state.pinError=false; drawPins(); return; }
    if(e.key.length===1){ state.pinBuffer+=e.key; state.pinError=false; drawPins(); }
  });

  return wrap;
}

function buildDetailSheet(sheet){

    </div>

  sheet.appendChild(head);

  const hero = el('div','detail-hero');
  hero.innerHTML = `<div class="avatar">${m.em}</div><div class="t">${esc(itemTitle(item,type))}</div><div class="s">${esc(m.label)}</div>`;
  sheet.appendChild(hero);

  const actions = el('div','detail-actions');

  favBtn.onclick = ()=>{ item.fav=!item.fav; render(); };

    actions.appendChild(quickCopy);
  }
  sheet.appendChild(actions);

  const card = el('div','card sheet-body-card');
  fieldSpec(type).forEach(f=>{

    if(val===undefined) return;
    if(!val && f.k!=='notes') { /* show even empty for structure? skip empty except notes */ }
    const row = el('div','detail-field');
    let displayVal = esc(val || '—');
    const revealKey = item.id+'-'+f.k;
    if(f.secret && val){
      const revealed = state.revealed.has(revealKey);
      displayVal = revealed ? `<span class="masked">${esc(val)}</span>` : `<span class="masked">${f.isCard? maskCard(val): maskFull(val)}</span>`;
    }
    row.innerHTML = `<div><div class="l">${esc(f.l)}</div><div class="v">${displayVal}</div></div>`;
    const acts = el('div','acts');
    if(f.secret && val){
      const eyeBtn = el('button','tiny-btn', state.revealed.has(revealKey)?'🙈':'👁️');

    }
    if(f.copy && val){
      const cBtn = el('button','tiny-btn','📋');
      cBtn.onclick = ()=> copyText(val, f.l, !!f.secret);

  sheet.appendChild(card);

  head.querySelector('#closeBtn').onclick = ()=>{ state.modal=null; render(); };

  head.querySelector('#delBtn').onclick = ()=>{
    if(confirm('هل تريد حذف هذا العنصر نهائيًا؟')){
      state.items[type] = state.items[type].filter(i=>i.id!==item.id);
      state.modal=null; render(); showToast('تم الحذف','🗑️');

  };
}

/* ============================= النسخ الاحتياطي (تصدير/استيراد) ============================= */
// التصدير: يُنزّل ملف JSON على جهاز المستخدم. إذا كانت كلمة مرور التطبيق مفعّلة، يُشفَّر الملف
// بنفس معيار AES-256 (بملح جديد مستقل) بحيث يبقى محميًا حتى لو خُزِّن في مكان أقل أمانًا (بريد، سحابة).
function exportBackup(){
  (async ()=>{
    try{
      const payload = { app:'khazna-vault', version:1, exportedAt: new Date().toISOString() };
      if(state.masterSet && state.masterPassword){
        if(!hasWebCrypto()){ showToast('التصدير المشفّر يحتاج HTTPS','⚠️'); return; }
        const {key, saltB64} = await deriveKey(state.masterPassword, null); // ملح مستقل خاص بملف النسخة
        const enc = await encryptJson(key, state.items);
        payload.encrypted = true;
        payload.salt = saltB64;
        payload.iv = enc.iv;
        payload.data = enc.data;
      } else {
        payload.encrypted = false;
        payload.items = state.items;
      }
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `khazna-backup-${dateStr}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      showToast(payload.encrypted ? '📤 تم تصدير نسخة احتياطية مشفّرة' : '📤 تم تصدير نسخة احتياطية', '✅');
    }catch(e){
      showToast('تعذّر التصدير، حاول مجددًا','⚠️');
    }
  })();
}
function triggerImport(){
  const input = document.createElement('input');
  input.type='file'; input.accept='application/json,.json';
  input.onchange = async ()=>{
    const file = input.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const payload = JSON.parse(text);
      if(!payload || (payload.encrypted===undefined)){ showToast('هذا الملف مو نسخة احتياطية صالحة من خزنة','⚠️'); return; }
      state.modal = {kind:'importFlow', payload, items:null};
      render();
    }catch(e){
      showToast('الملف غير صالح أو تالف','⚠️');
    }
  };
  input.click();
}
function buildImportFlowSheet(sheet){
  const modal = state.modal;
  sheet.innerHTML = `<div class="sheet-handle"></div>`;
  const head = el('div','sheet-head');
  head.innerHTML = `<div class="brand-badge" style="padding:0;"><span class="em">📥</span><span class="t">استيراد نسخة احتياطية</span></div><button class="tiny-btn" id="closeBtn">✕</button>`;
  sheet.appendChild(head);
  head.querySelector('#closeBtn').onclick = ()=>{ state.modal=null; render(); };

  const body = el('div'); body.style.padding='6px 16px 4px';

  // الخطوة 1: كلمة المرور، فقط إذا كان الملف مشفّرًا ولم يُفَك بعد
  if(modal.payload.encrypted && !modal.items){
    body.appendChild(el('p','sub','هذا الملف مشفّر. أدخل كلمة مرور التطبيق التي كانت مفعّلة وقت التصدير:'));
    const field = el('div','field');
    const wrap = el('div','pwd-wrap');
    const input = el('input'); input.type='password'; input.autocomplete='off';
    const eye = el('button','eye','👁️'); eye.type='button';
    eye.onclick = ()=>{ input.type = input.type==='password'?'text':'password'; eye.textContent = input.type==='password'?'👁️':'🙈'; };
    wrap.appendChild(input); wrap.appendChild(eye);
    field.appendChild(wrap);
    body.appendChild(field);
    sheet.appendChild(body);

    const btn = el('button','btn btn-primary','فك التشفير ومتابعة');
    btn.style.margin='0 16px 16px'; btn.style.width='calc(100% - 32px)';
    btn.onclick = async ()=>{
      if(!input.value){ showToast('اكتب كلمة المرور','⚠️'); return; }
      if(!hasWebCrypto()){ showToast('يحتاج HTTPS لفك التشفير','⚠️'); return; }
      btn.disabled=true; btn.textContent='جارٍ فك التشفير…';
      try{
        const {key} = await deriveKey(input.value, modal.payload.salt);
        const items = await decryptJson(key, {iv: modal.payload.iv, data: modal.payload.data});
        state.modal.items = items;
        render();
      }catch(e){
        showToast('كلمة المرور غير صحيحة','⚠️');
        btn.disabled=false; btn.textContent='فك التشفير ومتابعة';
      }
    };
    sheet.appendChild(btn);
    return;
  }

  // الخطوة 2: اختيار طريقة الدمج بعد توفر البيانات (مشفّرة كانت أو لا)
  const items = modal.items || modal.payload.items;
  if(!items){
    body.appendChild(el('p','sub','⚠️ الملف لا يحتوي بيانات صالحة.'));
    sheet.appendChild(body);
    return;
  }
  const totalCount = Object.values(items).reduce((s,l)=>s+((l&&l.length)||0),0);
  body.appendChild(el('p','sub', `تم العثور على ${totalCount} عنصر في الملف. اختر طريقة الاستيراد:`));
  sheet.appendChild(body);

  const mergeBtn = el('button','btn btn-primary','🔗 دمج مع بياناتي الحالية');
  mergeBtn.style.margin='0 16px 10px'; mergeBtn.style.width='calc(100% - 32px)';
  mergeBtn.onclick = ()=>{
    Object.keys(items).forEach(type=>{
      (items[type]||[]).forEach(it=>{
        const clone = Object.assign({}, it, {id:`it_${uid++}`});
        state.items[type] = state.items[type] || [];
        state.items[type].push(clone);
      });
    });
    state.modal=null; render(); showToast(`تم دمج ${totalCount} عنصر بنجاح`,'✅');
  };
  sheet.appendChild(mergeBtn);

  const replaceBtn = el('button','btn btn-danger','⚠️ استبدال كل بياناتي الحالية');
  replaceBtn.style.margin='0 16px 16px'; replaceBtn.style.width='calc(100% - 32px)';
  replaceBtn.onclick = ()=>{
    state.items = items;
    state.modal=null; render(); showToast('تم استبدال البيانات بالكامل','✅');
  };
  sheet.appendChild(replaceBtn);
}

function buildAppPasswordSheet(sheet, mode){
  const titles = {
    create: {t:'إنشاء كلمة مرور للتطبيق', s:'ستُطلب منك هذه الكلمة في كل مرة تفتح فيها التطبيق، وسيتم تشفير بياناتك محليًا بها (AES-256)'},
    change: {t:'تغيير كلمة المرور', s:'أدخل كلمة المرور الحالية ثم الجديدة — سيُعاد تشفير بياناتك بالكامل بالمفتاح الجديد'},
    remove: {t:'إزالة كلمة المرور', s:'سيفتح التطبيق مباشرة بدون طلب كلمة مرور، وستُحفظ بياناتك كنص عادي غير مشفّر بعد ذلك'},
  };
  const info = titles[mode];
  sheet.innerHTML = `<div class="sheet-handle"></div>`;
  const head = el('div','sheet-head');
  head.innerHTML = `<div class="brand-badge" style="padding:0;"><span class="em">🔑</span><span class="t">${info.t}</span></div><button class="tiny-btn" id="closeBtn">✕</button>`;
  sheet.appendChild(head);
  head.querySelector('#closeBtn').onclick = ()=>{ state.modal=null; render(); };

  const form = el('div');
  form.style.padding='6px 16px 4px';
  form.appendChild(el('p','sub', info.s));

  if((mode==='create' || mode==='change') && !hasWebCrypto()){
    form.appendChild(el('div','field-hint','⚠️ متصفحك/الصفحة الحالية لا تدعم التشفير (Web Crypto). يجب فتح التطبيق عبر HTTPS — مثل رابط GitHub Pages بعد رفعه — وليس بفتح الملف مباشرة من الجهاز.'));
  }

  function pwField(labelText){
    const field = el('div','field');
    field.appendChild(el('label',null,labelText));
    const wrap = el('div','pwd-wrap');
    const input = el('input');
    input.type='password'; input.autocomplete='off';
    const eye = el('button','eye','👁️'); eye.type='button';
    eye.onclick = ()=>{ input.type = input.type==='password'?'text':'password'; eye.textContent = input.type==='password'?'👁️':'🙈'; };
    wrap.appendChild(input); wrap.appendChild(eye);
    field.appendChild(wrap);
    form.appendChild(field);
    return input;
  }

  let currentInput=null, newInput=null, confirmInput=null;
  if(mode==='change' || mode==='remove') currentInput = pwField('كلمة المرور الحالية');
  if(mode==='create' || mode==='change'){
    newInput = pwField('كلمة المرور الجديدة');
    confirmInput = pwField('تأكيد كلمة المرور');
  }

  sheet.appendChild(form);

  const saveBtn = el('button','btn btn-primary', mode==='remove' ? 'إزالة كلمة المرور' : 'حفظ');
  saveBtn.style.margin='16px 16px 0'; saveBtn.style.width='calc(100% - 32px)';
  if(mode==='remove') saveBtn.classList.add('btn-danger');

  saveBtn.onclick = async ()=>{
    if(currentInput && currentInput.value !== state.masterPassword){
      showToast('كلمة المرور الحالية غير صحيحة','⚠️'); return;
    }
    if(mode==='remove'){
      // إعادة الحفظ كنص عادي، ثم حذف النسخة المشفّرة نهائيًا
      state.masterSet=false; state.cryptoKey=null; state.encSalt=null; state.masterPassword=null; state.bioEnabled=false;
      try{ localStorage.removeItem(ENC_STORAGE_KEY); }catch(e){}
      saveMetaToStorage();
      state.modal=null; render(); showToast('تمت إزالة كلمة المرور — البيانات الآن غير مشفّرة','✅');
      return;
    }
    if(!newInput.value || newInput.value.length<4){ showToast('اكتب كلمة مرور من 4 خانات على الأقل','⚠️'); return; }
    if(newInput.value !== confirmInput.value){ showToast('كلمتا المرور غير متطابقتين','⚠️'); return; }
    if(!hasWebCrypto()){ showToast('التشفير غير مدعوم؛ افتح التطبيق عبر HTTPS','⚠️'); return; }

    saveBtn.disabled = true;
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = 'جارٍ التشفير…';
    try{
      const {key, saltB64} = await deriveKey(newInput.value, null); // ملح جديد دائمًا عند الإنشاء/التغيير
      state.cryptoKey = key;
      state.encSalt = saltB64;
      state.masterPassword = newInput.value;
      state.masterSet = true;
      await saveEncryptedItems();
      saveMetaToStorage();
      state.modal=null; render();
      showToast(mode==='create' ? '🔒 تم تفعيل كلمة المرور وتشفير بياناتك' : '🔒 تم تغيير كلمة المرور وإعادة التشفير', '✅');
    }catch(e){
      showToast('حدث خطأ أثناء التشفير، حاول مجددًا','⚠️');
      saveBtn.disabled = false; saveBtn.textContent = originalLabel;
    }
  };
  sheet.appendChild(saveBtn);
}

/* ============================= PASSWORD GENERATOR ============================= */
function generatePassword(opts){
  const up='ABCDEFGHJKLMNPQRSTUVWXYZ', low='abcdefghijkmnpqrstuvwxyz', num='23456789', sym='!@#$%^&*_-+=';
  let pool='';
  if(opts.up) pool+=up;
  if(opts.low) pool+=low;
  if(opts.num) pool+=num;
  if(opts.sym) pool+=sym;
  if(!pool) pool = low+num;
  let out='';
  const arr = new Uint32Array(opts.len);
  (window.crypto||{getRandomValues:a=>a.forEach((_,i)=>a[i]=Math.floor(Math.random()*1e9))}).getRandomValues(arr);
  for(let i=0;i<opts.len;i++) out += pool[arr[i]%pool.length];
  return out;
}

/* ============================= SECURITY CENTER ============================= */
function renderSecurity(){
  const frag = el('div');
  const allPw = allItemsFlat().filter(i=>i.password).map(i=>({...i}));
  const weak = allPw.filter(i=> passwordStrength(i.password).score<=2);
  const seen = {}; const dupSet=new Set();
  allPw.forEach(i=>{ seen[i.password]=(seen[i.password]||0)+1; });
  allPw.forEach(i=>{ if(seen[i.password]>1) dupSet.add(i.id); });
  const noPw = allItemsFlat().filter(i=> ('password' in i) && !i.password);

  let score = 100;
  score -= weak.length*10;
  score -= dupSet.size*8;
  score -= noPw.length*6;
  score = Math.max(8, Math.min(100, score));
  const color = score>=75?'var(--safe)': score>=45?'var(--warn)':'var(--danger)';
  const circumference = 2*Math.PI*62;
  const offset = circumference * (1-score/100);

  frag.innerHTML = `
    <div class="topbar"><div><h1 class="h1">مركز الأمان</h1><p class="sub">نظرة شاملة على مستوى أمان بياناتك</p></div></div>
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg width="150" height="150">
          <circle cx="75" cy="75" r="62" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
          <circle cx="75" cy="75" r="62" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .6s ease;"/>
        </svg>
        <div class="num"><b style="color:${color}">${score}%</b><span>الأمان</span></div>
      </div>
      <p class="sub" style="margin-top:10px; text-align:center;">${score>=75?'خزنتك في وضع جيد 👍':score>=45?'هناك عناصر تحتاج مراجعة':'ننصح بمراجعة الأمان الآن'}</p>
    </div>
  `;

  const card = el('div','card');
  function secRow(icon,bg,color,title,sub){
    const r = el('div','sec-item');
    r.innerHTML = `<div class="ic" style="background:${bg}; color:${color};">${icon}</div><div class="txt"><div class="t">${title}</div><div class="s">${sub}</div></div>`;
    return r;
  }
  card.appendChild(secRow('⚠️','var(--danger-soft)','var(--danger)','كلمات مرور ضعيفة', `${weak.length} عنصر يحتاج كلمة مرور أقوى`));
  card.appendChild(secRow('♻️','var(--warn-soft)','var(--warn)','كلمات مرور مكررة', `${dupSet.size} عنصر يشترك بنفس كلمة المرور`));
  card.appendChild(secRow('🕓','var(--warn-soft)','var(--warn)','حسابات بلا كلمة مرور', `${noPw.length} عنصر بدون كلمة مرور مضافة`));
  card.appendChild(secRow('🔒','var(--safe-soft)','var(--safe)','التشفير المحلي', `مفعّل لجميع البيانات الحساسة`));
  frag.appendChild(card);

  const genCard = el('div','card');
  const genRow = el('div','sec-item');
  genRow.style.cursor='pointer';
  genRow.innerHTML = `<div class="ic" style="background:var(--accent-soft, var(--surface-2)); color:var(--accent);">🎲</div><div class="txt"><div class="t">مولّد كلمات المرور</div><div class="s">أنشئ كلمة مرور قوية وعشوائية بضغطة واحدة</div></div>`;
  genRow.onclick = ()=>{ state.route='generator'; render(); };
  genCard.appendChild(genRow);
  frag.appendChild(genCard);

  if(weak.length){
    frag.appendChild(el('div','section-title','<h3>يحتاج مراجعة</h3>'));
    const list = el('div');
    weak.slice(0,6).forEach(it=> list.appendChild(buildItemRow(it, it.__type)));
    frag.appendChild(list);
  }
  return frag;

    return r;
  }
  function switchRow(icon,title,on,onToggle){
    const r = el('div','set-row');
    r.innerHTML = `<div class="ic">${icon}</div><div class="t">${title}</div>`;
    const sw = el('button','switch'+(on?' on':''));
    sw.onclick = ()=>{ sw.classList.toggle('on'); onToggle(sw.classList.contains('on')); };
    r.appendChild(sw);
    return r;
  }
  function selectRow(icon,title,value,options,onChange){
    const r = el('div','set-row');
    r.innerHTML = `<div class="ic">${icon}</div><div class="t">${title}</div>`;
    const sel = el('select');
    sel.style.cssText = 'background:transparent; border:none; color:var(--text-dim); font:inherit; direction:rtl; max-width:130px;';
    options.forEach(o=>{
      const opt = el('option'); opt.value=o.v; opt.textContent=o.l;
      if(String(o.v)===String(value)) opt.selected=true;
      sel.appendChild(opt);
    });
    sel.onchange = ()=> onChange(sel.value);
    r.appendChild(sel);
    return r;
  }

  const securityRows = [];
  if(!state.masterSet){
    securityRows.push(row('🔑','إنشاء كلمة مرور للتطبيق', `<span class="chev">‹</span>`,
      ()=>{ state.modal={kind:'appPassword', mode:'create'}; render(); }));
  } else {
    securityRows.push(row('🔒','قفل التطبيق الآن', `<span class="chev">‹</span>`,
      ()=>{ lockVault(); render(); }));
    securityRows.push(selectRow('⏱️','القفل التلقائي', state.autoLockMinutes, [
      {v:0, l:'فورًا عند الخروج'},
      {v:1, l:'بعد دقيقة'},
      {v:5, l:'بعد 5 دقائق'},
      {v:15, l:'بعد 15 دقيقة'},
      {v:-1, l:'تعطيل'},
    ], (v)=>{ state.autoLockMinutes = parseInt(v,10); saveToStorage(); showToast('تم تحديث إعداد القفل التلقائي','⏱️'); }));
    securityRows.push(row('🔑','تغيير كلمة المرور', `<span class="chev">‹</span>`,
      ()=>{ state.modal={kind:'appPassword', mode:'change'}; render(); }));
    securityRows.push(row('🚫','إزالة كلمة مرور التطبيق', `<span class="chev">‹</span>`,
      ()=>{ state.modal={kind:'appPassword', mode:'remove'}; render(); }));
    securityRows.push(row('🔐','التشفير المحلي', `<span class="v" style="color:var(--safe);">مفعّل (AES-256)</span>`));
  }
  const bioRow = el('div','set-row');
  bioRow.style.opacity='.55';
  bioRow.innerHTML = `<div class="ic">👆</div><div class="t">البصمة / Face ID<div class="field-hint" style="margin-top:2px;">تُفعَّل تلقائيًا عند تحويل التطبيق لتطبيق جوّال حقيقي (Capacitor)</div></div><span class="v">قريبًا</span>`;
  securityRows.push(bioRow);
  frag.appendChild(group('الأمان', securityRows));

  frag.appendChild(group('المظهر واللغة', [
    switchRow('🌙','الوضع الليلي', state.theme==='dark', (v)=>{ state.theme=v?'dark':'light'; document.body.setAttribute('data-theme', state.theme); }),
    row('🌐','اللغة', `<span class="v">العربية</span>`, ()=>showToast('الإنجليزية ستُضاف قريبًا','🌐')),
  ]));

  frag.appendChild(group('البيانات', [
    row('📤','تصدير نسخة احتياطية', `<span class="chev">‹</span>`, ()=>exportBackup()),
    row('📥','استيراد نسخة احتياطية', `<span class="chev">‹</span>`, ()=>triggerImport()),
  ]));

  frag.appendChild(group('حول', [
    row('ℹ️','حول التطبيق', `<span class="chev">‹</span>`, ()=>showToast('خزنة — الإصدار 1.0.0 (تجريبي)','🔐')),
    row('📄','سياسة الخصوصية', `<span class="chev">‹</span>`, ()=>showToast('نموذج تجريبي — لا يتم رفع بياناتك لأي خادم','📄')),
    row('📃','شروط الاستخدام', `<span class="chev">‹</span>`, ()=>showToast('نموذج تجريبي لأغراض العرض فقط','📃')),
  ]));

  const noteBox = el('div','note', state.masterSet
    ? '🔒 بياناتك مشفّرة محليًا بمعيار AES-256، والمفتاح مشتق من كلمة مرورك ولا يُخزَّن في أي مكان. هذا نموذج أولي — عند تحويله لتطبيق جوّال حقيقي عبر Capacitor يُفضَّل ربط المفتاح أيضًا بخزنة النظام (Keychain/Keystore) لحماية إضافية.'
    : '⚠️ البيانات تُحفظ محليًا في متصفح جهازك حاليًا كنص عادي غير مشفّر (لا تُرفع لأي خادم). فعّل "إنشاء كلمة مرور للتطبيق" أعلاه لتشفيرها فعليًا.');
  frag.appendChild(noteBox);

  return frag;
}

/* ============================= BOTTOM NAV ============================= */
function renderBottomNav(){
  const nav = el('div','bottom-nav');
  const items = [
    {r:'dashboard', ic:'🏠', l:'الرئيسية'},
    {r:'items', ic:'🗂️', l:'العناصر'},
    {r:'add', ic:'+', l:'', fab:true},
    {r:'security', ic:'🛡️', l:'الأمان'},
    {r:'settings', ic:'⚙️', l:'الإعدادات'},
  ];
  items.forEach(it=>{
    const btn = el('button','nav-item' + (it.fab?' fab':'') + (state.route===it.r?' active':''));
    btn.innerHTML = it.fab ? `<span class="ic">${it.ic}</span>` : `<span class="ic">${it.ic}</span><span>${it.l}</span>`;
    btn.onclick = ()=>{
      if(it.r==='add'){ openAddSheet(); return; }
      if(it.r==='items'){ state.categoryType='account'; state.route='category'; render(); return; }
      state.route = it.r; render();
    };
    nav.appendChild(btn);
  });
  return nav;
}

/* ============================= AUTO LOCK ============================= */
['click','keydown','touchstart'].forEach(ev=>{
  document.addEventListener(ev, ()=>{ state.lastActivity = Date.now(); });
});

// القفل التلقائي يعمل فقط إذا أنشأ المستخدم كلمة مرور للتطبيق من الإعدادات.
setInterval(()=>{
  if(state.masterSet && !state.locked && state.route!=='lock' && state.autoLockMinutes>=1){
    const idleMs = Date.now()-state.lastActivity;
    if(idleMs > state.autoLockMinutes*60*1000){
      lockVault(); render();
    }
  }
}, 5000);

// قفل فوري عند مغادرة/تصغير التطبيق (تبديل التطبيقات، إغلاق الشاشة)
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    state.hiddenAt = Date.now();
  } else if(state.masterSet && !state.locked && state.hiddenAt){
    const awayMs = Date.now()-state.hiddenAt;
    const shouldLock = state.autoLockMinutes===0 || (state.autoLockMinutes>=1 && awayMs > state.autoLockMinutes*60*1000);
    if(shouldLock){
      lockVault(); render();
    }
    state.hiddenAt = null;
  }
});

render();

/* ============================= PWA: SERVICE WORKER ============================= */
// يعمل فقط عند الاستضافة عبر HTTPS (أو localhost)، وهو أحد شروط تثبيت PWA على أندرويد/iOS
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* تجاهل بيئات لا تدعمه (مثل فتح الملف مباشرة) */ });
  });
}
</script>
